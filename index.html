<style>
/* ===== 设计令牌 ===== */
:root{
  --cream:#F7F1E4;
  --cream-deep:#EFE6D2;
  --paper:#FFFDF7;
  --ink:#5C4632;
  --ink-soft:#8A6B52;
  --brown:#B08968;
  --brown-deep:#6B4F3A;
  --blue:#7D93A6;
  --blue-soft:#A9B8C6;
  --orange:#E8B98A;
  --orange-deep:#D9A066;
  --line:rgba(138,107,82,.18);
  --shadow:0 10px 30px rgba(139,107,82,.14);
  --radius:22px;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(1200px 500px at 85% -5%, rgba(233,185,138,.35), transparent 60%),
    radial-gradient(900px 420px at 8% 22%, rgba(169,184,198,.28), transparent 60%),
    linear-gradient(180deg,#F9F3E6 0%, var(--cream) 40%, #F4ECDB 100%);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(232,185,138,.5)}
a{color:var(--brown-deep)}
button{font-family:var(--sans)}
input,textarea{font-family:var(--sans)}

/* ===== 通用容器 ===== */
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.section-title{
  font-family:var(--serif);
  font-size:22px;
  font-weight:900;
  color:var(--ink);
  display:flex;
  align-items:center;
  gap:10px;
  margin:44px 0 16px;
}
.section-title svg{flex:none}
.section-title .sub{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--ink-soft);margin-left:auto}

/* ===== Hero ===== */
.hero{
  position:relative;
  min-height:420px;
  border-radius:0 0 34px 34px;
  overflow:hidden;
  display:flex;
  align-items:center;
  box-shadow:var(--shadow);
}

.hero-scrim{
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(60,42,26,.10) 0%, rgba(60,42,26,.05) 45%, rgba(60,42,26,.42) 100%);
}
.hero-inner{position:relative;z-index:2;width:100%;padding:120px 24px 40px;color:#fff;text-shadow:0 2px 14px rgba(60,42,26,.35)}
.hero-date{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:500;letter-spacing:.08em;
  background:rgba(255,253,247,.22);
  border:1px solid rgba(255,255,255,.35);
  padding:6px 14px;border-radius:999px;
  backdrop-filter:blur(4px);
}
.hero-title{
  font-family:var(--serif);
  font-size:40px;font-weight:900;
  line-height:1.25;
  margin-top:14px;
  letter-spacing:.02em;
}
.hero-sub{
  font-size:14px;margin-top:6px;
  color:rgba(255,253,247,.92);
}
.hero-quote{
  margin-top:22px;
  font-size:15px;line-height:1.8;
  font-family:var(--serif);
  max-width:560px;
  color:rgba(255,255,255,.96);
  border-left:3px solid rgba(255,253,247,.65);
  padding-left:14px;
  min-height:54px;
}
.hero-quote .src{display:block;font-family:var(--sans);font-size:12px;opacity:.72;margin-top:6px}
.hero-quote-btn{
  margin-top:10px;
  background:rgba(255,253,247,.16);
  color:#fff;
  border:1px solid rgba(255,255,255,.4);
  border-radius:999px;
  padding:7px 16px;
  font-size:12.5px;
  cursor:pointer;
  transition:background .25s;
  min-height:44px;
  display:inline-flex;align-items:center;gap:6px;
}
.hero-quote-btn:hover{background:rgba(255,253,247,.3)}

/* 漂浮云朵装饰 */
.cloud{position:absolute;z-index:1;opacity:.5;pointer-events:none}
.cloud.c1{top:56px;left:8%;width:110px}
.cloud.c2{top:120px;right:6%;width:84px;opacity:.38}
.cloud.c3{bottom:46px;right:22%;width:130px;opacity:.3}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.cloud{animation:drift 9s ease-in-out infinite alternate}

/* ===== 卡片通用 ===== */
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
}
.card-head{
  display:flex;align-items:center;gap:10px;
  font-family:var(--serif);font-weight:700;font-size:17px;
  color:var(--ink);
  margin-bottom:14px;
}
.card-head .hint{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--ink-soft);margin-left:auto}
.icon-chip{
  width:38px;height:38px;flex:none;
  border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(232,185,138,.28);
  color:var(--brown-deep);
}

/* ===== 灵感生成器 ===== */
.inspire-card{margin-top:22px}
.inspire-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,var(--brown) 0%, var(--orange-deep) 100%);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:12px 26px;
  font-size:15px;font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(176,137,104,.35);
  transition:transform .2s, box-shadow .2s;
  min-height:48px;
}
.inspire-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(176,137,104,.45)}
.inspire-btn:active{transform:translateY(0)}
.inspire-items{margin-top:18px;display:grid;grid-template-columns:1fr;gap:12px}
.ins-item{
  border-radius:16px;
  padding:14px 16px;
  display:grid;grid-template-columns:34px 1fr;gap:12px;
  align-items:start;
  border:1px solid var(--line);
  background:rgba(247,241,228,.6);
  opacity:0;transform:translateY(10px);
  transition:opacity .45s ease, transform .45s ease;
}
.ins-item.show{opacity:1;transform:translateY(0)}
.ins-item .ic{
  width:34px;height:34px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  background:#fff;color:var(--brown-deep);
  box-shadow:0 3px 8px rgba(139,107,82,.16);
}
.ins-item .tag{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--blue)}
.ins-item .body{font-size:14.5px;line-height:1.8;color:var(--ink);margin-top:2px}
.ins-item .body b{color:var(--brown-deep);font-weight:700}
.ins-item.style-t{background:rgba(247,241,228,.8)}
.ins-item.style-r{background:rgba(232,185,138,.22)}
.ins-item.style-todo{background:rgba(169,184,198,.22)}
.ins-item.style-know{background:rgba(233,222,200,.7)}
.ins-item.style-heal{background:rgba(255,253,247,.9)}
.ins-item.style-heal .tag{color:var(--orange-deep)}

/* ===== 工具网格 ===== */
.tools{display:grid;grid-template-columns:1fr;gap:18px;margin-top:6px}
@media (min-width:768px){
  .tools{grid-template-columns:repeat(3,1fr)}
}

/* 待办清单 */
.todo-add{display:flex;gap:8px;margin-bottom:14px}
.todo-add input{
  flex:1;min-width:0;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:0 14px;
  font-size:16px;
  color:var(--ink);
  outline:none;
  min-height:46px;
  transition:border-color .2s;
}
.todo-add input:focus{border-color:var(--brown)}
.todo-add button{
  flex:none;
  border:none;background:var(--brown);color:#fff;
  border-radius:12px;
  width:46px;min-height:46px;
  font-size:20px;cursor:pointer;
  transition:background .2s;
  display:inline-flex;align-items:center;justify-content:center;
}
.todo-add button:hover{background:var(--brown-deep)}
.todo-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.todo-list li{
  display:flex;align-items:center;gap:10px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:9px 12px;
  min-height:48px;
  transition:opacity .25s;
}
.todo-list li.done{opacity:.55}
.todo-list li.done .todo-text{text-decoration:line-through;color:var(--ink-soft)}
.todo-check{
  flex:none;width:22px;height:22px;border-radius:7px;
  border:2px solid var(--blue-soft);
  background:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;
  padding:0;
}
.todo-check:hover{border-color:var(--blue)}
.todo-check.on{background:var(--blue);border-color:var(--blue)}
.todo-text{flex:1;min-width:0;font-size:14.5px;word-break:break-all}
.todo-del{
  flex:none;width:32px;height:32px;
  border:none;background:transparent;color:var(--blue-soft);
  border-radius:8px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s;
}
.todo-del:hover{background:rgba(169,184,198,.25);color:var(--blue)}
.todo-stat{font-size:12px;color:var(--ink-soft);margin-top:12px}
.todo-empty{font-size:13px;color:var(--ink-soft);text-align:center;padding:18px 0;border:1px dashed var(--line);border-radius:12px}

/* 心情打卡 */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood-btn{
  border:1px solid var(--line);background:#fff;
  border-radius:14px;
  padding:10px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;
  transition:transform .18s, border-color .18s, background .18s;
  min-height:60px;
}
.mood-btn svg{width:26px;height:26px;color:var(--ink-soft)}
.mood-btn span{font-size:11px;color:var(--ink-soft)}
.mood-btn:hover{transform:translateY(-3px);border-color:var(--brown)}
.mood-btn.on{border-color:var(--brown);background:rgba(232,185,138,.28)}
.mood-btn.on svg,.mood-btn.on span{color:var(--brown-deep)}
.mood-today{margin-top:14px;font-size:13px;color:var(--ink-soft);min-height:22px}
.week-strip{margin-top:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week-day{text-align:center;font-size:11px;color:var(--ink-soft)}
.week-dot{
  width:30px;height:30px;margin:0 auto 4px;
  border-radius:50%;
  background:#fff;border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;
}
.week-dot svg{width:16px;height:16px}
.week-dot.today{border-color:var(--orange-deep);box-shadow:0 0 0 3px rgba(232,185,138,.25)}
.week-day .wd-name{font-size:10px}

/* 番茄钟 */
.pomodoro-body{display:flex;flex-direction:column;align-items:center;gap:16px}
.timer-ring{position:relative;width:190px;height:190px}
.timer-ring svg{width:190px;height:190px;transform:rotate(-90deg)}
.timer-ring .track{fill:none;stroke:rgba(169,184,198,.4);stroke-width:12}
.timer-ring .bar{fill:none;stroke:var(--orange-deep);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.timer-num{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--serif);
}
.timer-num .num{font-size:40px;font-weight:900;color:var(--ink)}
.timer-num .lbl{font-size:11px;color:var(--ink-soft);letter-spacing:.14em;margin-top:2px}
.timer-ctrl{display:flex;gap:10px}
.timer-ctrl button{
  min-height:46px;min-width:96px;
  border:none;border-radius:999px;
  font-size:14px;font-weight:700;cursor:pointer;
  transition:transform .18s, box-shadow .18s, background .2s;
}
.btn-start{background:linear-gradient(135deg,var(--blue) 0%, #647F96 100%);color:#fff;box-shadow:0 6px 16px rgba(125,147,166,.35)}
.btn-start:hover{transform:translateY(-2px)}
.btn-reset{background:#fff;color:var(--ink-soft);border:1px solid var(--line) !important}
.btn-reset:hover{background:var(--cream-deep)}

/* ===== Footer ===== */
footer{
  margin-top:56px;
  padding:26px 0 40px;
  text-align:center;
  font-size:12px;color:var(--ink-soft);
}
footer .line{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
footer .line::before,footer .line::after{content:"";width:44px;height:1px;background:var(--line)}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;bottom:34px;
  transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--cream);
  padding:11px 20px;border-radius:999px;
  font-size:13.5px;opacity:0;pointer-events:none;
  transition:opacity .3s, transform .3s;
  z-index:99;box-shadow:0 10px 26px rgba(60,42,26,.3);
  max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 无障碍 & 动效 ===== */
button:focus-visible,input:focus-visible{outline:3px solid rgba(176,137,104,.55);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<!-- ===== 视图：Hero ===== -->

  <svg class="cloud c1" viewBox="0 0 120 40" fill="#fff" aria-hidden="true"><path d="M12 30a14 14 0 0 1 0-28 18 18 0 0 1 34 0 13 13 0 0 1 22 4 15 15 0 0 1 20 24H12z" opacity=".9"/></svg>
  <svg class="cloud c2" viewBox="0 0 120 40" fill="#fff" aria-hidden="true"><path d="M12 30a14 14 0 0 1 0-28 18 18 0 0 1 34 0 13 13 0 0 1 22 4 15 15 0 0 1 20 24H12z"/></svg>
  <svg class="cloud c3" viewBox="0 0 120 40" fill="#fff" aria-hidden="true"><path d="M12 30a14 14 0 0 1 0-28 18 18 0 0 1 34 0 13 13 0 0 1 22 4 15 15 0 0 1 20 24H12z" opacity=".85"/></svg>

<main class="wrap">

  <!-- ===== 视图：灵感生成器 ===== -->

    今日灵感生成器

  </h2>
  <section class="card inspire-card" aria-label="今日灵感生成器">
    <div class="card-head">
      <span class="icon-chip">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.2 4.9 5.4.6-4 3.5 1.1 5.3L12 15l-4.7 2.3 1.1-5.3-4-3.5 5.4-.6z"/></svg>
      </span>

  <!-- ===== 视图：工具三件套 ===== -->

      <div class="card-head">
        <span class="icon-chip">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>

        </span>

        <span class="hint">点一下记录</span>
      </div>
      <div class="moods" id="moods"></div>
      <div class="mood-today" id="moodToday"></div>
      <div class="week-strip" id="weekStrip"></div>

    <!-- 番茄钟 -->
    <section class="card" aria-label="专注番茄钟">
      <div class="card-head">
        <span class="icon-chip">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg>

<footer>
  <div class="line">今日生活能量站</div>
  灵感、待办与心情都保存在你的本地浏览器里<br>愿你度过被温柔对待的一天

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== 工具函数 ===== */
const $=s=>document.querySelector(s);
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const pad=n=>String(n).padStart(2,"0");
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400);
}
function load(key,fb){try{const v=JSON.parse(localStorage.getItem(key));return v??fb}catch(e){return fb}}
function save(key,val){localStorage.setItem(key,JSON.stringify(val))}

/* ===== Hero：日期与引言 ===== */
const WEEK=["日","一","二","三","四","五","六"];
function fmtDate(d){
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 · 星期${WEEK[d.getDay()]}`;
}
$("#heroDate").textContent=fmtDate(new Date());

const QUOTES=[
  {t:"生活明朗，万物可爱。认真吃饭，好好睡觉，把今天过好。",s:"—— 能量站小语"},
  {t:"不必追赶每一分钟，给呼吸留一扇窗，日子自会透进光。",s:"—— 能量站小语"},
  {t:"慢慢来，比较快。先做好手边这一件小事。",s:"—— 能量站小语"},
  {t:"心情像天气，阴晴都正常。记得给自己撑一把伞。",s:"—— 能量站小语"},
  {t:"你认真生活的样子，本身就很治愈。",s:"—— 能量站小语"},
  {t:"今日宜：把手机放远一点，把喜欢的事做久一点。",s:"—— 能量站小语"},
  {t:"小小的进步，也是进步。今天的你，比昨天更靠近光。",s:"—— 能量站小语"}
];
let qi=Math.floor(Math.random()*QUOTES.length);
function renderQuote(){
  const q=QUOTES[qi];$("#heroQuote").innerHTML=`${q.t}<span class="src">${q.s}</span>`;
}
$("#quoteBtn").addEventListener("click",()=>{qi=(qi+1)%QUOTES.length;renderQuote()});
renderQuote();

/* ===== 今日灵感生成器 ===== */
const OUTER=[
  "燕麦色针织开衫","浅蓝棉麻衬衫","米白亚麻长袖","焦糖色宽松卫衣","灰蓝格纹衬衫","奶油色高领毛衣"
];
const INNER=["白色T恤","燕麦色背心","条纹打底衫","浅灰吊带","纯色衬衫","莫兰迪色针织内搭"];
const BOTTOM=["卡其色阔腿裤","灰蓝色直筒裤","米色半身裙","深棕休闲裤","奶油白工装裤","燕麦色灯芯绒裤"];
const SHOES=["白色帆布鞋","棕色乐福鞋","浅灰运动鞋","米色德训鞋","复古短靴"];
const ACC=["一条驼色围巾","帆布托特包","银色细项链","针织贝雷帽","木质手表","浅色袜子"];

const DISH=[
  {name:"番茄炖牛腩",note:"酸甜开胃，配米饭绝佳"},
  {name:"滑蛋虾仁",note:"嫩滑鲜香，十分钟搞定"},
  {name:"土豆咖喱鸡",note:"浓郁下饭，剩饭救星"},
  {name:"南瓜浓汤",note:"暖胃治愈，入口绵密"},
  {name:"蒜蓉蒸娃娃菜",note:"清爽少油，晚餐首选"},
  {name:"香菇滑鸡煲仔饭",note:"锅巴香脆，一锅满足"}
];
const TASKS=[
  "给窗台的植物浇一次水",
  "读十页你正在看的书",
  "给一位老朋友发条问候消息",
  "整理书桌一角，只留最常用的三样",
  "出门散步二十分钟，不戴耳机",
  "写下今天最想感谢的一件事",
  "提前十分钟上床，把手机放客厅",
  "认真做一顿早餐并拍照记录",
  "给杯子换杯温水，慢慢喝完",
  "关掉多余的提示音，安静一小时"
];
const KNOWS=[
  "蜜蜂采蜜时会记住花朵的位置，认路靠的是太阳与紫外线偏振光。",
  "番茄曾经被欧洲人当作观赏植物，两百多年前才普遍成为餐桌食材。",
  "人的记忆没有上限，忘掉的多是「没被反复想起」的信息。",
  "一杯 37℃ 的温水，能让疲惫的胃最先放松下来。",
  "蓝鲸一次呼吸吸入的空气，约等于一千五百个气球。",
  "柠檬水加热后并不影响维生素 C 太多，微微温着喝没问题。"
];
const HEALS=[
  "愿你今天也记得：你已经做得足够好。",
  "疲惫的时候，允许自己慢一点，天不会塌。",
  "把烦恼写下来，它就变小了一半。",
  "好好照顾自己，是从今天开始的小事，也是大事。",
  "没有白走的路，每一次尝试都算数。",
  "今晚的月亮，也会替世界温柔地看看你。"
];
const pick=a=>a[Math.floor(Math.random()*a.length)];

const INS_TPL=[
  {cls:"style-t",tag:"今日穿搭",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3c1.5-.5 3 .5 3 2l-1 8a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4l-1-8c0-1.5 1.5-2.5 3-2a3 3 0 0 1 3-3z"/></svg>',body:""},
  {cls:"style-r",tag:"今日食谱",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18"/><path d="M12 11c0-4 1-7 4-8 0 4-1 7-4 8z"/><path d="M4 11l1.5 8a2 2 0 0 0 2 1.5h9a2 2 0 0 0 2-1.5L20 11"/></svg>',body:""},
  {cls:"style-todo",tag:"今日小任务",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M21 12v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg>',body:""},
  {cls:"style-know",tag:"今日冷知识",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>',body:""},
  {cls:"style-heal",tag:"治愈一句",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.6-9.5-9A5 5 0 0 1 12 6.5 5 5 0 0 1 21.5 12c-2.5 4.4-9.5 9-9.5 9z"/></svg>',body:""}
];

function genInspire(){
  const outfit=`<b>${pick(OUTER)}</b> × <b>${pick(INNER)}</b> + <b>${pick(BOTTOM)}</b> + <b>${pick(SHOES)}</b>，再搭${pick(ACC)}，今天走${pick(["慵懒","清爽","复古","温柔","元气"])}路线`;
  const dish=pick(DISH);
  const recipe=`今晚试试 <b>${dish.name}</b>：${dish.note}`;
  const task=`<b>${pick(TASKS)}</b>`;
  const know=pick(KNOWS);
  const heal=pick(HEALS);
  const bodies=[outfit,recipe,task,know,heal];
  const box=$("#inspireItems");
  box.innerHTML=INS_TPL.map((t,i)=>`
    <div class="ins-item ${t.cls}">
      <span class="ic">${t.icon}</span>
      <div><div class="tag">${t.tag}</div><div class="body">${bodies[i]}</div></div>
    </div>`).join("");
  requestAnimationFrame(()=>{
    [...box.children].forEach((el,i)=>setTimeout(()=>el.classList.add("show"),i*90));
  });
}
$("#inspireBtn").addEventListener("click",genInspire);
genInspire();

/* ===== 今日待办（按天存储） ===== */
const todoKey=`todos_${todayStr()}`;
let todos=load(todoKey,[]);
function renderTodos(){
  const list=$("#todoList");
  list.innerHTML=todos.map((it,i)=>`
    <li class="${it.done?"done":""}">
      <button class="todo-check ${it.done?"on":""}" data-i="${i}" type="button" aria-label="${it.done?"标记未完成":"标记完成"}">
        ${it.done?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>':""}
      </button>
      <span class="todo-text">${it.t}</span>
      <button class="todo-del" data-i="${i}" type="button" aria-label="删除待办">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </li>`).join("");
  $("#todoEmpty").style.display=todos.length?"none":"block";
  const done=todos.filter(t=>t.done).length;
  $("#todoStat").textContent=todos.length?`已完成 ${done} / ${todos.length} · 记得给完成的自己点个赞`:"";
  save(todoKey,todos);
}
function addTodo(){
  const inp=$("#todoInput");const v=inp.value.trim();
  if(!v){toast("先写点内容再添加吧");return}
  todos.push({t:v,done:false});inp.value="";renderTodos();
}
$("#todoAdd").addEventListener("click",addTodo);
$("#todoInput").addEventListener("keydown",e=>{if(e.key==="Enter")addTodo()});
$("#todoList").addEventListener("click",e=>{
  const chk=e.target.closest(".todo-check");
  const del=e.target.closest(".todo-del");
  if(chk){todos[+chk.dataset.i].done=!todos[+chk.dataset.i].done;renderTodos()}
  else if(del){todos.splice(+del.dataset.i,1);renderTodos();toast("已移除这条待办")}
});
renderTodos();

/* ===== 今日心情打卡 ===== */
const MOODS=[
  {n:"开心",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.3 9.2c.8.8 1.9.8 2.7 0"/><path d="M13 9.2c.8.8 1.9.8 2.7 0"/><path d="M8.5 14.3c1.2 1.5 5.8 1.5 7 0"/></svg>'},
  {n:"平静",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 9.5h2.3"/><path d="M13.7 9.5H16"/><path d="M9 14.5h6"/></svg>'},
  {n:"疲惫",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.1 10.4c.9-.7 2-.7 2.9 0"/><path d="M13 10.4c.9-.7 2-.7 2.9 0"/><path d="M9.5 15h5"/></svg>'},
  {n:"低落",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 9.5h2.3"/><path d="M13.7 9.5H16"/><path d="M9 14.8c1.3-1.7 4.7-1.7 6 0"/></svg>'},
  {n:"烦躁",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 8.6l3 1"/><path d="M16 8.6l-3 1"/><path d="M9.5 14.5h5"/></svg>'}
];
const moodKey=`moods_${todayStr()}`;
let todayMood=load(moodKey,null);
function moodDateStr(offset){
  const d=new Date();d.setDate(d.getDate()-offset);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function renderMoods(){
  $("#moods").innerHTML=MOODS.map((m,i)=>`
    <button class="mood-btn ${todayMood===i?"on":""}" data-m="${i}" type="button">
      ${m.icon}<span>${m.n}</span>
    </button>`).join("");
  $("#moodToday").textContent=todayMood===null?"今天还没打卡，点一个表情吧":`今天的心情：${MOODS[todayMood].n}`;
  let happy=0;
  const cells=[];
  for(let off=6;off>=0;off--){
    const key=`moods_${moodDateStr(off)}`;
    const m=load(key,null);
    if(m!==null&&(m===0||m===1))happy++;
    const d=new Date();d.setDate(d.getDate()-off);
    const isToday=off===0;
    cells.push(`
      <div class="week-day ${isToday?"today":""}">
        <div class="week-dot ${isToday?"today":""} ${m===null?"":""}" title="${d.getMonth()+1}月${d.getDate()}日${m===null?"":("："+MOODS[m].n)}">
          ${m===null?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/></svg>':MOODS[m].icon}
        </div>
        <div class="wd-name">${isToday?"今天":("周"+WEEK[d.getDay()])}</div>
      </div>`);
  }
  $("#weekStrip").innerHTML=cells.join("");
  $("#moodToday").textContent+=(todayMood!==null?` · `:` `)+`本周愉悦 ${happy}/7 天`;
}
$("#moods").addEventListener("click",e=>{
  const b=e.target.closest(".mood-btn");
  if(!b)return;
  todayMood=+b.dataset.m;
  save(moodKey,todayMood);
  renderMoods();
  toast(`已记录：${MOODS[todayMood].n}`);
});
renderMoods();

/* ===== 专注番茄钟 ===== */
const POMO_TOTAL=25*60;
let pomoRemain=POMO_TOTAL;
let pomoRunning=false;
let pomoEnd=0;
let pomoTimer=null;
const RING_C=2*Math.PI*84;
$("#timerBar").style.strokeDasharray=RING_C;
$("#timerBar").style.strokeDashoffset=0;
function fmtTime(s){return `${pad(Math.floor(s/60))}:${pad(s%60)}`}
function paintPomo(){
  $("#timerNum").textContent=fmtTime(pomoRemain);
  $("#timerBar").style.strokeDashoffset=RING_C*(1-pomoRemain/POMO_TOTAL);
  $("#timerLbl").textContent=pomoRunning?"专注中":(pomoRemain<POMO_TOTAL?"已暂停":"准备开始");
  $("#timerStart").textContent=pomoRunning?"暂停":"开始";
}
function tick(){
  const left=pomoEnd-Date.now();
  if(left<=0){
    clearInterval(pomoTimer);pomoTimer=null;
    pomoRunning=false;pomoRemain=POMO_TOTAL;
    paintPomo();toast("专注完成，起来走走，喝口水吧");
    return;
  }
  pomoRemain=Math.ceil(left/1000);
  paintPomo();
}
$("#timerStart").addEventListener("click",()=>{
  if(pomoRunning){
    clearInterval(pomoTimer);pomoTimer=null;
    pomoRunning=false;paintPomo();
    return;
  }
  if(pomoRemain<=0){pomoRemain=POMO_TOTAL}
  pomoRunning=true;pomoEnd=Date.now()+pomoRemain*1000;
  pomoTimer=setInterval(tick,300);
  paintPomo();
});
$("#timerReset").addEventListener("click",()=>{
  clearInterval(pomoTimer);pomoTimer=null;
  pomoRunning=false;pomoRemain=POMO_TOTAL;
  paintPomo();
});
paintPomo();
</script>
